name: Android CI

on:
  push:
    branches:
      - '*'
    tags:
      - '*' 
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: 17
          check-latest: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build with Gradle
        id: build
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee gradle-build.log

      - name: Upload failure diagnostics
        if: failure() && steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: build-failure-diagnostics
          path: |
            gradle-build.log
            build/reports/problems/problems-report.html
            app/build/outputs/mapping/**/*
          if-no-files-found: warn

      - name: Uploading Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-normal-release.apk
          path: ./app/build/outputs/apk/normal/release/app-normal-release.apk
          if-no-files-found: error

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: app/build/outputs/apk/normal/release/app-normal-release.apk
          asset_name: app-normal-release-${{ github.run_number }}.apk
          tag: ${{ github.ref_type == 'tag' && github.ref_name || 'ci-builds' }}
          overwrite: true
